name: Signed test build
run-name: Test build of ${{ inputs.ref }}

# Builds signed installers from any branch or commit without publishing a
# release, so no signing key is needed on a developer machine. Download them
# from the run's Artifacts section.
#
# Test builds use the next patch version with a -test suffix (for example
# 1.2.4-test.7). Installed apps do not downgrade to the current release, and
# they update normally once that next version is released.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        type: string
        default: main
      targets:
        description: Platforms to build
        required: true
        type: choice
        default: macos
        options:
          - macos
          - all

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      version: ${{ steps.prepare.outputs.version }}
      targets: ${{ steps.prepare.outputs.targets }}
    steps:
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ inputs.ref }}
          TARGETS: ${{ inputs.targets }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GH_REPO/commits/$REF" --jq .sha)
          latest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // "v0.0.0"')
          IFS=. read -r major minor patch <<< "${latest#v}"
          version="$major.$minor.$((patch + 1))-test.$RUN_NUMBER"
          if [ "$TARGETS" = all ]; then targets=linux,windows,macos; else targets=macos; fi
          echo "Building $version from $REF ($sha)."
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "targets=$targets"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build-desktop.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      targets: ${{ needs.prepare.outputs.targets }}
      artifact_prefix: test-build
      retention_days: 14
    secrets: inherit
