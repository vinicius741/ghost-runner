name: Publish desktop release
run-name: Release ${{ inputs.release_tag || github.event.release.tag_name }}

# Normally started by `pnpm release` (scripts/release.js) or from the Actions
# tab. A new tag is built into a draft release, which is published only after
# every installer and update file is attached and verified, so installed apps
# never see a release they cannot update from.
#
# For an existing release, files are rebuilt and attached again. Publishing a
# release by hand on GitHub still works, but the release is visible to apps
# while its files build.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable tag such as v1.2.3. A new tag creates a release; an existing one has its files rebuilt.
        required: true
        type: string
      ref:
        description: Branch or commit for a new release. Ignored when the release already exists.
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      ref: ${{ steps.prepare.outputs.ref }}
      publish: ${{ steps.prepare.outputs.publish }}
    steps:
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          TARGET_REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a stable release tag such as v1.2.3."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = release ]; then
            state=published
          else
            state=$(gh release view "$RELEASE_TAG" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo missing)
          fi

          case "$state" in
            published)
              echo "Rebuilding files for the published release $RELEASE_TAG."
              echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            draft)
              ref=$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)
              echo "Resuming the draft release $RELEASE_TAG at $ref."
              echo "ref=$ref" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            missing)
              latest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
              if [ -n "$latest" ]; then
                highest=$(printf '%s\n%s\n' "${latest#v}" "$version" | sort -V | tail -n 1)
                if [ "$highest" != "$version" ] || [ "${latest#v}" = "$version" ]; then
                  echo "::error::$RELEASE_TAG must be higher than the latest release $latest."
                  exit 1
                fi
              fi
              sha=$(gh api "repos/$GH_REPO/commits/$TARGET_REF" --jq .sha)
              gh release create "$RELEASE_TAG" --draft --target "$sha" --title "Ghost Runner $RELEASE_TAG" --generate-notes
              echo "Created the draft release $RELEASE_TAG at $sha."
              echo "ref=$sha" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    needs: prepare
    uses: ./.github/workflows/build-desktop.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      # The verification script comes from the default branch, so older tags
      # can be rebuilt with the current checks.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Attach installers and update metadata
        run: gh release upload "$RELEASE_TAG" release/* --clobber
      - name: Verify release files
        run: node scripts/release.js verify "$RELEASE_TAG"
      # Publishing with the workflow token does not start this workflow again.
      - name: Publish release
        if: needs.prepare.outputs.publish == 'true'
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
