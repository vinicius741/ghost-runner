name: Publish desktop release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to build and attach files to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            args: --linux --x64
          - os: windows-latest
            target: windows
            args: --win --x64
          - os: macos-latest
            target: macos
            args: --mac --universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Set installer version from release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          node -e "const fs = require('fs'); const tag = process.env.RELEASE_TAG; const version = tag.replace(/^v/, ''); if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Use a stable release tag such as v1.2.3'); const pkg = JSON.parse(fs.readFileSync('package.json')); pkg.version = version; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
      - run: pnpm run build:frontend:verified
      - run: pnpm run build:server
      - run: pnpm run build:electron
      - run: pnpm test
      # macOS only installs an update signed with the same certificate as the
      # installed app. MAC_CSC_LINK is either a Developer ID certificate (with
      # the APPLE_* secrets for notarization) or the project's self-signed
      # certificate from scripts/macos-create-signing-cert.sh.
      - name: Check macOS signing configuration
        id: mac-signing
        if: matrix.target == 'macos'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping macOS installers. Configure the signing secrets in documentation/auto-updates.md to enable them."
          elif [ -n "$APPLE_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "mode=self-signed" >> "$GITHUB_OUTPUT"
          fi
      - name: Package Windows and Linux
        if: matrix.target != 'macos'
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
      - name: Package macOS
        if: matrix.target == 'macos' && steps.mac-signing.outputs.enabled == 'true'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          P12_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_MODE: ${{ steps.mac-signing.outputs.mode }}
        run: |
          if [ "$SIGNING_MODE" = developer-id ]; then
            node -e "for (const key of ['P12_PASSWORD', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD', 'APPLE_TEAM_ID']) { if (!process.env[key]) throw new Error('Missing macOS signing secret: ' + key); }"
          elif [ -z "$P12_PASSWORD" ]; then
            echo "::error::Missing macOS signing secret: MAC_CSC_KEY_PASSWORD"; exit 1
          fi
          p12="$RUNNER_TEMP/mac-signing.p12"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$p12"
          notarize=true
          if [ "$SIGNING_MODE" = self-signed ]; then
            # electron-builder only signs with identities macOS trusts for code
            # signing, so trust the self-signed certificate on this runner.
            /usr/bin/openssl pkcs12 -in "$p12" -clcerts -nokeys -passin env:P12_PASSWORD -out "$RUNNER_TEMP/mac-signing.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/mac-signing.pem"
            notarize=false
          fi
          scripts/macos-with-signing-keychain.sh "$p12" -- \
            pnpm exec electron-builder ${{ matrix.args }} --publish never \
            --config.mac.forceCodeSigning=true --config.mac.notarize=$notarize
          rm -f "$p12"
      - uses: actions/upload-artifact@v4
        if: matrix.target != 'macos' || steps.mac-signing.outputs.enabled == 'true'
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Attach installers and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber
